<html lang="es"><head><meta charset="utf-8">
<script>window.__bip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;window.dispatchEvent(new Event('pachote-installable'))});
try{const t=localStorage.getItem('pachote_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F3FD0">
<meta name="description" content="Pachote: reparte gastos de grupo, viajes y casa, con familias y niños. Cuentas claras, a pachas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pachote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
/* Layout: columna tipo app móvil (máx 680px); cabecera con plan y cifras, 4 pestañas, hoja inferior para editar. */
:root{
  --bg:#F1F3EE; --surface:#FFFFFF; --sunk:#E7EBE4; --ink:#17201B; --muted:#5D6A62; --line:#D9E0D6;
  --accent:#2F3FD0; --accent-ink:#FFFFFF; --accent-soft:#E3E6FB;
  --pos:#1D7A4C; --pos-soft:#DDF1E5; --neg:#BF3A22; --neg-soft:#F8E1DA; --warn:#B7791F;
  --shadow:0 1px 2px rgba(23,32,27,.06),0 6px 24px rgba(23,32,27,.07);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#182019; --sunk:#131915; --ink:#E6EDE8; --muted:#94A39A; --line:#28322B;
  --accent:#8E98FF; --accent-ink:#0D1030; --accent-soft:#232848;
  --pos:#5ED394; --pos-soft:#17301F; --neg:#FF8C74; --neg-soft:#3A1E17; --warn:#E8B04A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#182019; --sunk:#131915; --ink:#E6EDE8; --muted:#94A39A; --line:#28322B;
  --accent:#8E98FF; --accent-ink:#0D1030; --accent-soft:#232848;
  --pos:#5ED394; --pos-soft:#17301F; --neg:#FF8C74; --neg-soft:#3A1E17; --warn:#E8B04A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 110px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* Cabecera */
header{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.topbar{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;color:var(--muted)}
.brand svg{width:28px;height:28px;flex:none}
.bname{display:flex;flex-direction:column;line-height:1.05;color:var(--ink)}
.bname small{white-space:nowrap;font-family:var(--f-body);font-weight:500;font-size:11.5px;letter-spacing:0;color:var(--muted);margin-top:2px}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.ghost:hover{background:var(--sunk)}
.planrow{display:flex;align-items:center;gap:8px;min-width:0}
.planpick{appearance:none;border:none;background:none;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,34px);line-height:1.1;padding:0 26px 0 0;min-width:0;max-width:100%;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 12px) 55%,calc(100% - 6px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.planpick option{font-size:16px;font-family:var(--f-body)}
.iconbtn{border:none;background:var(--sunk);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.badge{white-space:nowrap;font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos)}
.badge.local::before{background:var(--neg)}
.badge.local{background:rgba(0,0,0,.35);color:#fff;padding:3px 9px;border-radius:999px}
.badge.local span{display:inline!important}

/* Pestañas */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{border:none;background:none;padding:9px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
main{display:flex;flex-direction:column;gap:14px}

/* Listas */
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:4px 2px -6px;display:flex;gap:8px;align-items:center}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:none;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
button.row:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-family:var(--f-display);font-weight:700;font-size:17px;white-space:nowrap}
.amt.inc{color:var(--pos)} .amt.out{color:var(--neg)} .amt.tr{color:var(--ink)}
.cat{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:800;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);white-space:nowrap}
.wt{font-size:10.5px;font-weight:700;background:var(--sunk);color:var(--muted);border-radius:6px;padding:1px 5px;white-space:nowrap}
.kid{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 5px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:8px;padding:8px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Saldos */
.ticket{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 16px 14px;font-family:var(--f-mono);font-size:13.5px}
.ticket h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-align:center;font-weight:500;color:var(--muted)}
.ticket .tl{border-top:1.5px dashed var(--line);margin:12px 0}
.tr{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:6px 0;align-items:center}
.tr .who{min-width:0;overflow-wrap:anywhere}
.tr .who em{font-style:normal;color:var(--muted)}
.tr .who .pw{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-body);font-weight:700;font-size:14.5px}
.tr .who .pf{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.tr b{font-weight:500;white-space:nowrap}
.paybtn{font-family:var(--f-body);border:1.5px solid var(--pos);color:var(--pos);background:none;border-radius:999px;padding:4px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.paybtn:hover{background:var(--pos-soft)}
.ticket .foot{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ok{text-align:center;padding:10px 0;color:var(--pos)}
.thermo{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.thermo .ends{display:flex;justify-content:space-between;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.thermo .ends span:first-child{color:var(--neg)} .thermo .ends span:last-child{color:var(--pos)}
.trow{display:flex;flex-direction:column;gap:4px}
.trow .lab{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.trow .lab b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .lab .v{font-family:var(--f-display);font-weight:700;white-space:nowrap}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)} .v.zero{color:var(--muted)}
.track{position:relative;height:30px;background:linear-gradient(90deg,var(--neg-soft),var(--sunk) 50%,var(--pos-soft));border-radius:99px}
.track::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;background:var(--line);border-radius:2px}
.track .fill{position:absolute;top:13px;height:4px;border-radius:4px}
.track .bub{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid var(--surface);z-index:1;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.3)}}
.mood{font-size:12px;color:var(--muted)}
.paidlist .row .amt{font-size:15px}

/* Gente */
.qa{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.qa .line{display:flex;gap:8px}
.qa input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px}
.qa .opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.qa select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 8px;font-size:13px;max-width:100%}
.toggle{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-weight:600;font-size:13px}
.toggle[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.zone{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border-top:4px solid var(--hc,var(--line));padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,transform .15s}
.zone.over{box-shadow:0 0 0 3px var(--accent),var(--shadow);transform:scale(1.01)}
.zone .zh{display:flex;align-items:center;gap:8px}
.zone .zh h3{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zone .zh small{color:var(--muted);font-size:12px;white-space:nowrap}
.zone.solo{border-top-style:dashed}
.zone.new{border:2px dashed var(--line);box-shadow:none;background:none;align-items:center;justify-content:center;min-height:64px;color:var(--muted);font-weight:600;font-size:14px;text-align:center}
.zone.new.over{border-color:var(--accent);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.mchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-weight:600;font-size:14px;touch-action:pan-y;-webkit-touch-callout:none;transition:transform .12s,box-shadow .12s;user-select:none;-webkit-user-select:none;cursor:grab}
.av.ph{background-size:cover!important;background-position:center!important;color:transparent!important}
.meav{width:38px;height:38px;border-radius:50%;border:2px solid var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-weight:800;color:#fff;background:var(--accent);padding:0;font-size:14px;flex:none;margin-left:8px}
.gbanner .meav{border-color:rgba(255,255,255,.6);width:36px;height:36px}
.instbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font:inherit}
.instbtn .ico{font-size:24px}.instbtn span:nth-child(2){flex:1;display:flex;flex-direction:column}.instbtn small{color:var(--muted);font-size:12.5px}.instbtn .chev{color:var(--accent);font-size:20px}
.meav.menu{background:var(--surface);color:var(--ink);border-color:var(--line)}
.gbanner .meav.menu{background:rgba(255,255,255,.18);color:#fff}
.mitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:none;border-radius:14px;padding:12px 14px;color:inherit;text-decoration:none;font:inherit}
.mitem .ico{font-size:20px;width:26px;text-align:center;flex:none}
.mitem .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mitem .mt small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .chev{color:var(--muted)}
.mprof .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.mgroup{display:flex;flex-direction:column;gap:1px;border-radius:14px;overflow:hidden;background:var(--line)}
.mgroup .mitem{border-radius:0}
.mgh{background:var(--bg);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 2px 6px}
.legal p{margin:0 0 10px;line-height:1.5;font-size:14.5px}.legal a{color:var(--accent)}
.loglist{display:flex;flex-direction:column;gap:0;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lg{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:flex-start}
.lg:last-child{border-bottom:none}.lg .li{font-size:16px;line-height:1.2;flex:none;width:20px;text-align:center}
.lg .lt{flex:1;min-width:0;overflow-wrap:anywhere}.lg .lm{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.lg button{flex:none;font-size:12.5px}
.pfav{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:34px;margin:0 auto;position:relative}
.pfav .cam{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;border:3px solid var(--bg)}
.whog{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.whog button{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:600;font-size:13.5px}
.whog button .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800}
.whog button[aria-pressed="true"],.whog button.sug{border-color:var(--accent);background:var(--accent-soft)}
.kidc .kid{display:none}
.mchip .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.mchip small{color:var(--muted);font-weight:500;font-size:12px}
.mchip.lifting{opacity:.3}
.mchip.ghostc{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:rotate(-3deg) scale(1.06);cursor:grabbing;background:var(--surface)}
.sub{display:flex;flex-direction:column;gap:4px;border-radius:10px;padding:4px 6px 6px;transition:background .12s}
.sub.kids{background:var(--accent-soft)}
.sub.over{background:var(--sunk);box-shadow:inset 0 0 0 2px var(--accent)}
.subl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sub.kids .subl{color:var(--accent)}
.featoffer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px;border:1px dashed var(--line);border-radius:var(--r);font-size:13px;color:var(--muted)}
.featoffer span{width:100%;text-align:center}
.msearch input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;height:44px;font-size:15px}
.sub.kids.ek{flex-direction:row;align-items:center;gap:8px;padding:3px 8px;background:none;border:1px dashed var(--line)}
.sub.kids.ek .empty-z{font-size:12px}
body.dragging .sub.kids.ek{padding:10px 8px;background:var(--accent-soft)}
.hgrip{cursor:grab;touch-action:pan-y;-webkit-touch-callout:none;transition:transform .12s,box-shadow .12s;user-select:none;-webkit-user-select:none;color:var(--muted);font-weight:800;letter-spacing:-2px;padding:4px 6px;border-radius:8px;line-height:1}
.hgrip:hover{background:var(--sunk)}
.mchip.ins-before{box-shadow:-4px 0 0 0 var(--accent)}
.mchip.ins-after{box-shadow:4px 0 0 0 var(--accent)}
.zone.ins-before{box-shadow:0 -4px 0 0 var(--accent),var(--shadow)}
.zone.ins-after{box-shadow:0 4px 0 0 var(--accent),var(--shadow)}
.zone.lifting{opacity:.35}
.ghostz{position:fixed;z-index:50;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.28);transform:rotate(-1.5deg);opacity:.95}
.zone.new.over{border-color:var(--accent);color:var(--accent)}
.famlink{border:none;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.famlink:hover{text-decoration:underline}
.mtab .mt{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:8px;align-items:center;padding:9px 12px;border:none;background:none;width:100%;text-align:right;font-size:13.5px}
.mtab .mt+.mt{border-top:1px solid var(--line)}
.mtab .mt .nm{text-align:left;font-weight:600;min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center}
.mtab .mt.h{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding-block:7px}
.mtab .mt.h span:first-child{text-align:left}
.mtab button.mt:hover{background:var(--sunk)}
.mtab .v{font-family:var(--f-display);font-weight:700}
.fsec{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.fsec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.fsec>summary::-webkit-details-marker{display:none}
.fsec>summary .ico{font-size:20px;line-height:1;width:26px;text-align:center}
.fsec>summary .st{font-weight:700;font-size:15px}
.fsec>summary .ss{margin-left:auto;font-size:13px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
.fsec>summary::after{content:"▾";color:var(--muted);font-size:12px;transition:transform .15s}
.fsec[open]>summary::after{transform:rotate(180deg)}

function splitWeighted(total,ids,weightOf){

  rem.sort((a,b)=>b[0]-a[0]);for(let i=0;i<total-used;i++)out[rem[i%rem.length][1]]++;

}

function roundKeepSum(obj,tgt){
  const ks=Object.keys(obj);const EPS=1e-6;const out={};let s=0;
  ks.forEach(k=>{const v=obj[k];const r=Math.round(v);out[k]=Math.abs(v-r)<EPS?r:Math.floor(v);s+=out[k]});
  const target=tgt!=null?tgt:Math.round(ks.reduce((a,k)=>a+obj[k],0));
  let diff=target-s;if(!diff){for(const k in out)out[k]=out[k]||0;return out}
  const frac=k=>obj[k]-out[k];
  const cand=ks.filter(k=>Math.abs(obj[k]-Math.round(obj[k]))>=EPS);
  const pool=cand.length?cand:ks.filter(k=>Math.abs(obj[k])>=EPS).length?ks.filter(k=>Math.abs(obj[k])>=EPS):ks;
  if(diff>0){const o=[...pool].sort((a,b)=>frac(b)-frac(a)||a.localeCompare(b));for(let i=0;i<diff;i++)out[o[i%o.length]]++}
  else{const o=[...pool].sort((a,b)=>frac(a)-frac(b)||a.localeCompare(b));for(let i=0;i<-diff;i++)out[o[i%o.length]]--}

function guard(retry){if(plan()?._me?.role==='viewer'){toast('Tienes permiso de solo ver en este grupo.');return true}if(plan()?.closed){toast('El grupo está cerrado. Reábrelo para hacer cambios.');return true}
  if(ST&&!knownWriter(plan())){askWho(true,retry||(()=>{}));return true}return false}
function setTab(t){S.tab=t;try{localStorage.setItem('cf_tab2',t)}catch(e){}render();window.scrollTo({top:0})}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='tab')setTab(v);else if(a==='newplan')openPlan();else if(a==='editplan')openPlan(plan().id);
  else if(a==='entry')openEntry(v);else if(a==='filter'){S.filter=v;render()}
  else if(a==='copy')copyTx();else if(a==='settle'){if(!guard(()=>settle(+v)))settle(+v)}else if(a==='undo'){if(!guard(()=>undoSettle(v)))undoSettle(v)}
  else if(a==='hh'){if(!guard(()=>openHH(v)))openHH(v)}else if(a==='goto')setTab(v);
  else if(a==='fam')openFamily(v);
  else if(a==='person')openPerson(v);
  else if(a==='open'){S.mq='';S.current=v;S.tab='movs';render();window.scrollTo({top:0});try{history.pushState({g:v},'','#g')}catch(x){}askWho()}
  else if(a==='profile'){openProfile()}
  else if(a==='menu'){openMenu()}
  else if(a==='install'){doInstall()}
  else if(a==='feat'){if(guard())return;const np=clone(plan());np.features={...featOf(np),[v]:true};FEAT=featOf(np);savePlan(np);
    toast(v==='families'?'👪 Familias activadas':'🧸 Niños activados')}
  else if(a==='home'){S.current=null;render();window.scrollTo({top:0});if(history.state&&history.state.g)try{history.back()}catch(x){}}
  else if(a==='sp'){S.sp=v;render()}
  else if(a==='sgran'){S.sgran=v;try{localStorage.setItem('cf_sgran_'+S.current,v)}catch(x){}const y=window.scrollY;render();window.scrollTo({top:y})}
  else if(a==='scat'){S.scat=v;render();setTimeout(()=>document.getElementById('histcard')?.scrollIntoView({behavior:'smooth',block:'start'}),30)}
  else if(a==='feat'){if(guard())return;const np=clone(plan());np.features={...featOf(np),[v]:!featOf(np)[v]};savePlan(np);
    toast(v==='families'?(np.features.families?'Familias activadas':'Familias ocultas: cada persona salda lo suyo. No se borra nada.'):(np.features.kids?'Niños activados':'Niños ocultos: todos cuentan como adultos con su peso. No se borra nada.'))}
  else if(a==='bal'){S.bal=v;try{localStorage.setItem('cf_bal',v)}catch(x){}render()}
  else if(a==='reopen'){const np=clone(plan());delete np.closed;savePlan(np);toast('Grupo reabierto')}
});

/* Movimientos */
function viewMovs(p,c){
  if(!p.members.length)return `<div class="empty"><h2>Primero, la gente</h2><p>Añade a los miembros del grupo de golpe y arrástralos a su familia.</p><button class="btn" data-act="goto" data-v="gente">Ir a Gente</button></div>`;
  const q=(S.mq||'').trim();const nn=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const qn=nn(q);
  const list=!qn?p.expenses:p.expenses.filter(e=>{const who=[e.payer,e.to].map(k=>k?unitName(p,k):'').join(' ');const ps=(e.parts||[]).map(id=>(p.members.find(m=>m.id===id)||{}).name).join(' ');
    return nn(e.desc+' '+catOf(e.cat).n+' '+who+' '+ps+' '+centsToInput(e.amount)).includes(qn)});
  let body;
  if(!p.expenses.length)body=`<div class="empty"><h2>Sin movimientos todavía</h2><p>Pulsa Añadir para apuntar un gasto, un ingreso o una transferencia entre miembros.</p></div>`;
  else if(!list.length)body=`<p class="hint" style="text-align:center;padding:20px 0">Nada coincide con «${esc(q)}».</p>`;
  else{
    const by={};[...list].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0)).forEach(e=>{(by[e.date]??=[]).push(e)});
    body=Object.entries(by).map(([d,es])=>`<div class="section-label">${esc(fmtDate(d))}</div><div class="list">${es.map(e=>rowEntry(p,e)).join('')}</div>`).join('');
  }
  const tot=qn&&list.length?`<p class="hint" style="margin:0 2px">${list.length} ${list.length===1?'movimiento':'movimientos'} · gastos ${money(list.filter(e=>kindOf(e)==='gasto').reduce((a,e)=>a+e.amount,0))}</p>`:'';
  return (p.expenses.length>6?`<div class="msearch"><input id="mq" type="search" placeholder="🔎 Buscar: cena, Carlos, 25…" value="${esc(S.mq||'')}" aria-label="Buscar movimientos" autocomplete="off"></div>${tot}`:'')+(new Set(p.expenses.map(kindOf)).size>1&&!qn?`<div class="legend" style="padding:0 2px"><span><span class="dot" style="background:var(--neg)"></span>Gastos</span><span><span class="dot" style="background:var(--pos)"></span>Ingresos</span><span><span class="dot" style="background:var(--ink)"></span>Transferencias</span></div>`:'')+body;
}
function rowEntry(p,e){
  const k=kindOf(e);
  if(k==='transfer'){
    return `<button class="row" data-act="entry" data-v="${e.id}"><div class="cat" style="background:var(--sunk);color:var(--muted)">⇄</div>
    <div class="main"><div class="t">${esc(e.desc||'Transferencia')}${e.settle&&!/liquidaci/i.test(e.desc||'')?' <span class="chip">pago de deuda</span>':''}${e.carry?' <span class="chip">saldo anterior</span>':''}</div><div class="s">${esc(unitName(p,e.payer))} → ${esc(unitName(p,e.to))}</div></div><div class="amt tr num">${money(e.amount)}</div></button>`}
  const n=(e.parts||[]).length;const mode=MODES.find(m=>m.k===(e.mode||'peso'));
  if(k==='ingreso')return `<button class="row" data-act="entry" data-v="${e.id}"><div class="cat" style="background:var(--pos-soft);color:var(--pos)">+</div>
    <div class="main"><div class="t">${esc(e.desc)}</div><div class="s">${esc(unitName(p,e.payer))} lo recibió · para ${n===p.members.length?'todos':n+' pers.'}</div></div><div class="amt inc num">+${money(e.amount)}</div></button>`;
  const cat=catOf(e.cat);const rg=fmtRange(e);
  return `<button class="row" data-act="entry" data-v="${e.id}"><div class="cat e" style="background:${cat.c}22">${cat.l}</div>
    <div class="main"><div class="t">${esc(e.desc)}</div><div class="s"><span class="dot" style="background:${unitColor(p,unitOf(p,e.payer))}"></span> ${esc(unitName(p,e.payer))} pagó · ${n===p.members.length?'todos':n+' pers.'} · ${esc(modeLabel(p,e.mode,e.parts))}${rg?' · '+esc(rg):''}</div></div>
    <div class="amt out num">−${money(e.amount)}</div></button>`;
}

function mood(v,max){
  const a=Math.abs(v);if(a<100)return 'En paz con el universo';
  if(v>0)return a>max*.6?'El banco oficial del viaje':'Le deben unas monedas';
  return a>max*.6?'Tiembla, cartera':'Debe un poquito';
}

  </div>

  <div class="thermo">
    <div class="ends"><span>Debe</span><span>Le deben</span></div>
    ${units.map(u=>{const v=c.net[u];const pos=50+v/max*44;const cls=v>0?'pos':v<0?'neg':'zero';const col=unitColor(p,u);
      return `<div class="trow"><div class="lab"><b>${u.startsWith('h:')?`<button class="famlink" data-act="fam" data-v="${u.slice(2)}">${esc(unitName(p,u))} ›</button>`:esc(unitName(p,u))+mTags(p.members.find(m=>'m:'+m.id===u))}</b><span class="v ${cls} num">${v>0?'+':''}${money(v)}</span></div>

function settle(i){

function undoSettle(id){const np=clone(plan());np.expenses=np.expenses.filter(e=>e.id!==id);savePlan(np);toast('Pago deshecho')}
function copyTx(){const t=window.__txt||'';try{navigator.clipboard.writeText(t).then(()=>toast('Copiado. Pégalo en el grupo.'),()=>toast('Este visor no deja copiar.'))}catch(e){toast('Este visor no deja copiar.')}}

/* Stats */
function spreadByDay(gastos){
  const byDay={};
  gastos.forEach(e=>{const ds=dayList(pS(e),pE(e));const sh=splitWeighted(e.amount,ds,()=>1);ds.forEach(d=>byDay[d]=(byDay[d]||0)+(sh[d]||0))});
  return byDay;
}
/* Estadísticas: periodo elegible, por grupo y tipo, evolución diaria o mensual e historial de un tipo (útil para luz, agua, internet…). */
const SPERIODS=[['todo','Todo'],['mes','Este mes'],['mesant','Mes pasado'],['anio','Este año'],['12m','Últimos 12 meses']];
function periodRange(k){const t=today();const y=+t.slice(0,4),m=+t.slice(5,7);const pad=n=>String(n).padStart(2,'0');const last=(yy,mm)=>new Date(Date.UTC(yy,mm,0)).getUTCDate();
  if(k==='mes')return [`${y}-${pad(m)}-01`,`${y}-${pad(m)}-${last(y,m)}`];
  if(k==='mesant'){const yy=m===1?y-1:y,mm=m===1?12:m-1;return [`${yy}-${pad(mm)}-01`,`${yy}-${pad(mm)}-${last(yy,mm)}`]}
  if(k==='anio')return [`${y}-01-01`,`${y}-12-31`];
  if(k==='12m'){const d=new Date(t+'T00:00:00Z');d.setUTCMonth(d.getUTCMonth()-11);return [d.toISOString().slice(0,7)+'-01',t]}
  return null}
const monthKey=d=>d.slice(0,7);
/* Columnas: con muchas barras solo se rotulan el máximo y la última, y las fechas se acortan. */
function colsHTML(items,color){const n=items.length;const mx=Math.max(1,...items.map(x=>x[1]));const iMax=items.findIndex(x=>x[1]===mx);const dense=n>8;
  return `<div class="cols${dense?' dense':''}">${items.map(([l,v],i)=>`<div class="col"><i style="height:${Math.max(2,v/mx*100)}%${color?';background:'+color:''}">${!dense||i===iMax||i===n-1?`<span>${esc(Math.abs(v)>=10000000?eurC.format(v/100):eur0.format(Math.round(v/100)))}</span>`:''}</i><small>${esc(l)}</small></div>`).join('')}</div>`}
const fmtMonthS=(k,i)=>{const m=new Date(k+'-15T12:00').toLocaleDateString('es-ES',{month:'short'}).replace('.','');return (i===0||k.endsWith('-01'))?`${m} ${k.slice(2,4)}`:m};
const fmtMonth=k=>new Date(k+'-15T12:00').toLocaleDateString('es-ES',{month:'short',year:'2-digit'});
function viewStats(p,c){
  const all=p.expenses.filter(e=>kindOf(e)==='gasto');
  if(!all.length)return `<div class="empty"><h2>Faltan datos</h2><p>Las estadísticas aparecen en cuanto apuntes el primer gasto.</p></div>`;
  S.sp??='todo';const rg=periodRange(S.sp);const inR=d=>!rg||(d>=rg[0]&&d<=rg[1]);
  /* Cada gasto se reparte por días (su periodo o su fecha) y nos quedamos con la parte que cae en el periodo elegido. */
  const byDay={},byCat={},byGroup={},pp={},cons={};let total=0,count=0;
  all.forEach(e=>{const ds=dayList(pS(e),pE(e));const sh=splitWeighted(e.amount,ds,()=>1);let part=0;
    ds.forEach(d=>{if(!inR(d))return;byDay[d]=(byDay[d]||0)+sh[d];part+=sh[d]});if(!part)return;
    count++;total+=part;const f=part/e.amount;const cat=catOf(e.cat);byCat[cat.k]=(byCat[cat.k]||0)+part;byGroup[cat.g]=(byGroup[cat.g]||0)+part;
    const j=jointOf(p,e.payer);if(j){const hs=jointHolders(p,j);hs.forEach(m=>pp[m.id]=(pp[m.id]||0)+part/hs.length)}else{const k=asPerson(p,e.payer);if(k&&k.startsWith('m:'))pp[k.slice(2)]=(pp[k.slice(2)]||0)+part}
    const s=sharesOf(p,e);for(const id in s)cons[id]=(cons[id]||0)+s[id]*f});

  if(!total)return chips+`<div class="empty"><h2>Nada en este periodo</h2><p>No hay gastos entre el ${esc(fmtShort(rg[0]))} y el ${esc(fmtShort(rg[1]))}.</p></div>`;
  const ds=Object.keys(byDay).filter(d=>byDay[d]).sort();const span=dayList(ds[0],ds[ds.length-1]);span.forEach(d=>byDay[d]??=0);
  if(S.sgranFor!==p.id){S.sgranFor=p.id;try{S.sgran=localStorage.getItem('cf_sgran_'+p.id)||'auto'}catch(x){S.sgran='auto'}}
  const monthly=S.sgran==='mes'||(S.sgran!=='dia'&&span.length>45);
  const granSeg=`<div class="seg" style="margin:-2px 0 8px" role="group" aria-label="Agrupar por"><button data-act="sgran" data-v="dia" aria-pressed="${!monthly}">Por días</button><button data-act="sgran" data-v="mes" aria-pressed="${monthly}">Por meses</button></div>`;const byMonth={};span.forEach(d=>byMonth[monthKey(d)]=(byMonth[monthKey(d)]||0)+byDay[d]);
  const series=monthly?Object.keys(byMonth).sort().map((k,i)=>[fmtMonthS(k,i),byMonth[k]]):span.map(d=>[span.length>8?String(+d.slice(8)):fmtShort(d),byDay[d]]);const sMax=Math.max(1,...series.map(x=>x[1]));
  const months=Object.keys(byMonth).length;
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);const catMax=catRows[0][1];
  const grpRows=CAT_GROUPS.filter(([g])=>byGroup[g]).map(([g,t])=>[t,byGroup[g]]).sort((a,b)=>b[1]-a[1]);
  const payRows=p.members.filter(m=>pp[m.id]>0).sort((a,b)=>pp[b.id]-pp[a.id]);const payMax=Math.max(1,...payRows.map(m=>pp[m.id]));
  const consRows=p.members.filter(m=>cons[m.id]>0.5).sort((a,b)=>cons[b.id]-cons[a.id]);const consMax=Math.max(1,...consRows.map(m=>cons[m.id]));
  /* Historial de un tipo, siempre sobre todo el plan, por meses */
  const allCats=[...new Set(all.map(e=>catOf(e.cat).k))];
  if(!S.scat||!allCats.includes(S.scat)){const casa=allCats.filter(k=>catOf(k).g==='casa');S.scat=(casa[0]||catRows[0][0])}
  const hKey=d=>monthly?monthKey(d):d;
  const hist={};all.filter(e=>catOf(e.cat).k===S.scat).forEach(e=>{const dd=dayList(pS(e),pE(e));const sh=splitWeighted(e.amount,dd,()=>1);dd.forEach(d=>hist[hKey(d)]=(hist[hKey(d)]||0)+sh[d])});
  const hk=Object.keys(hist).sort();const hAll=!hk.length?[]:!monthly?dayList(hk[0],hk[hk.length-1]):(()=>{const out=[];let [y,m]=hk[0].split('-').map(Number);const [ly,lm]=hk[hk.length-1].split('-').map(Number);while(y<ly||(y===ly&&m<=lm)){const k=`${y}-${String(m).padStart(2,'0')}`;out.push(k);m++;if(m>12){m=1;y++}}return out})();
  const hLab=(k,i)=>monthly?fmtMonthS(k,i):(hAll.length>8?String(+k.slice(8)):fmtShort(k));const uM=monthly?'mes':'día';
  const hMax=Math.max(1,...hAll.map(k=>hist[k]||0));const hTot=hAll.reduce((a,k)=>a+(hist[k]||0),0);const hAvg=hAll.length?hTot/hAll.length:0;const hLast=hAll.length?(hist[hAll[hAll.length-1]]||0):0;
  const hc=catOf(S.scat);const diff=hAvg?Math.round((hLast-hAvg)/hAvg*100):0;
  return `${chips}
  <div class="kpis">
    <div class="kpi"><span>Gastado</span><b class="num">${moneyK(total)}</b></div>
    <div class="kpi"><span>${monthly?'Media al mes':'Media al día'}</span><b class="num">${money(Math.round(monthly?total/months:total/span.length))}</b></div>
    <div class="kpi"><span>${monthly?'Meses':'Días'}</span><b class="num">${monthly?months:span.length}</b></div>
    <div class="kpi"><span>Gastos</span><b class="num">${count}</b></div>
  </div>
  ${grpRows.length>1?`<div class="card"><h3>Por grupo</h3>${grpRows.map(([t,v])=>`<div class="hbar"><span class="n">${t}</span><span class="b"><i style="width:${v/grpRows[0][1]*100}%;background:var(--accent)"></i></span><span class="x">${money(v)} · ${Math.round(v/total*100)}%</span></div>`).join('')}</div>`:''}
  <div class="card"><h3>En qué se va el dinero</h3>
    ${catRows.map(([k,v])=>{const cat=catOf(k);return `<button class="hbar hlink" data-act="scat" data-v="${k}"><span class="n">${cat.l} ${cat.n}</span><span class="b"><i style="width:${v/catMax*100}%;background:${cat.c}"></i></span><span class="x">${money(v)} · ${Math.round(v/total*100)}%</span></button>`}).join('')}
    <p class="hint">Toca un tipo para ver su historial.</p>
  </div>
  <div class="card"><h3>${monthly?'Gasto por mes':'Gasto por día'}</h3>
    ${granSeg}${colsHTML(series)}
  </div>
  <div class="card" id="histcard"><h3>Historial de un tipo</h3>
    <select id="scatsel" aria-label="Tipo de gasto" class="catbtn" style="padding:9px 10px">${CAT_GROUPS.map(([g,t])=>{const ks=allCats.filter(k=>catOf(k).g===g);return ks.length?`<optgroup label="${t}">${ks.map(k=>`<option value="${k}" ${k===S.scat?'selected':''}>${catOf(k).l} ${catOf(k).n}</option>`).join('')}</optgroup>`:''}).join('')}</select>

/* Arrastrar: personas (a familia / adultos / niños / delante de otra persona) y familias (reordenar) */
let drag=null;
function clearMarks(){document.querySelectorAll('.over,.ins-before,.ins-after').forEach(x=>x.classList.remove('over','ins-before','ins-after'))}
function memberTarget(x,y,selfId){
  const t=document.elementFromPoint(x,y);if(!t)return null;
  const chip=t.closest('[data-mchip]');
  if(chip&&chip.dataset.mchip!==selfId){const r=chip.getBoundingClientRect();const sub=chip.closest('[data-sub]');
    return {type:'chip',el:chip,id:chip.dataset.mchip,after:x>r.left+r.width/2,zone:sub.dataset.sub,kid:sub.dataset.kid==='1'}}
  const sub=t.closest('[data-sub]');if(sub)return {type:'sub',el:sub,zone:sub.dataset.sub,kid:sub.dataset.kid==='1'};
  const z=t.closest('[data-zone]');if(z)return {type:'zone',el:z,zone:z.dataset.zone};
  return null;
}
function famTarget(x,y,selfId){
  const t=document.elementFromPoint(x,y);const z=t&&t.closest('[data-fam]');if(!z||z.dataset.fam===selfId)return null;
  const r=z.getBoundingClientRect();return {el:z,id:z.dataset.fam,after:y>r.top+r.height/2};
}
function bindDrag(el,kind){
  const key=kind==='m'?el.dataset.mchip:el.dataset.hgrip;
  if(kind==='m')el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPerson(key)}});
  else el.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();nudgeFamily(key,e.key==='ArrowUp'?-1:1)}});
  /* En pantallas táctiles hay que mantener pulsado un momento antes de arrastrar; si el dedo se mueve antes, es scroll. */
  el.addEventListener('contextmenu',e=>{if(drag&&drag.el===el)e.preventDefault()});
  el.addEventListener('touchmove',e=>{if(drag&&drag.el===el&&(drag.armed||drag.on))e.preventDefault()},{passive:false});
  el.addEventListener('pointerdown',ev=>{
    if(ev.pointerType==='mouse'&&ev.button!==0)return;
    const touch=ev.pointerType!=='mouse';
    drag={key,kind,el,x:ev.clientX,y:ev.clientY,on:false,armed:!touch,touch,pid:ev.pointerId};
    if(touch){const d=drag;d.timer=setTimeout(()=>{if(drag!==d)return;d.armed=true;el.classList.add('armed');try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}try{el.setPointerCapture(d.pid)}catch(x){}},380)}
    else try{el.setPointerCapture(ev.pointerId)}catch(e){}
  });
  el.addEventListener('pointermove',ev=>{
    if(!drag||drag.el!==el)return;
    if(!drag.on){
      const mv=Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y);
      if(!drag.armed){if(mv>8){clearTimeout(drag.timer);drag=null}return}
      if(mv<7)return;
      drag.on=true;S.dragging=true;document.body.classList.add('dragging');
      const src=kind==='m'?el:el.closest('[data-fam]');const r=src.getBoundingClientRect();
      const g=src.cloneNode(true);g.classList.add(kind==='m'?'ghostc':'ghostz');g.style.width=r.width+'px';g.removeAttribute('data-fam');g.removeAttribute('data-zone');
      g.querySelectorAll('[data-sub],[data-mchip],[data-fam]').forEach(n=>{n.removeAttribute('data-sub');n.removeAttribute('data-mchip')});
      document.body.appendChild(g);drag.g=g;drag.src=src;drag.ox=ev.clientX-r.left;drag.oy=ev.clientY-r.top;src.classList.add('lifting');
    }
    drag.g.style.left=(ev.clientX-drag.ox)+'px';drag.g.style.top=(ev.clientY-drag.oy)+'px';
    clearMarks();
    if(kind==='m'){const t=memberTarget(ev.clientX,ev.clientY,key);if(t){if(t.type==='chip')t.el.classList.add(t.after?'ins-after':'ins-before');else t.el.classList.add('over')}}
    else{const t=famTarget(ev.clientX,ev.clientY,key);if(t)t.el.classList.add(t.after?'ins-after':'ins-before')}
    if(ev.clientY<70)window.scrollBy(0,-14);else if(ev.clientY>innerHeight-70)window.scrollBy(0,14);
  });
  const end=(ev,cancel)=>{
    if(!drag||drag.el!==el)return;const d=drag;drag=null;clearTimeout(d.timer);el.classList.remove('armed');
    if(d.on){d.g.remove();d.src.classList.remove('lifting');clearMarks();S.dragging=false;document.body.classList.remove('dragging');
      const t=cancel?null:(kind==='m'?memberTarget(ev.clientX,ev.clientY,key):famTarget(ev.clientX,ev.clientY,key));
      if(t){kind==='m'?moveMember(key,t):moveFamily(key,t)}else{S.pending=false;render()}}
    else if(!cancel&&kind==='m')openPerson(key);
  };
  el.addEventListener('pointerup',ev=>end(ev,false));
  el.addEventListener('pointercancel',ev=>end(ev,true));
}
function setKidState(m,kid){
  if(isKid(m)===kid)return;
  m.kid=kid;const w=wOf(m);if(kid&&w>=1)m.weight=0.5;if(!kid&&w<1)m.weight=1;
}
function moveMember(id,t){
  const np=clone(plan());const i=np.members.findIndex(x=>x.id===id);if(i<0){render();return}
  const m=np.members[i];const before=JSON.stringify(np.members);let msg='';
  let zone=t.zone;
  if(zone==='new'){const h={id:uid(),name:'Familia de '+m.name,color:HC[np.households.length%HC.length]};np.households.push(h);zone=h.id;msg=`Creada «${h.name}». Toca el lápiz para renombrarla.`}
  const hh=!FEAT.families?(m.hh||null):(zone==='none'?null:zone);const famChanged=(m.hh||null)!==hh;
  m.hh=hh;if(t.kid!==undefined)setKidState(m,t.kid);
  np.members.splice(i,1);
  if(t.type==='chip'){let j=np.members.findIndex(x=>x.id===t.id);if(t.after)j++;np.members.splice(j,0,m)}
  else{const inZone=x=>(x.hh||null)===hh&&(t.kid===undefined||isKid(x)===t.kid);let j=-1;np.members.forEach((x,k)=>{if(inZone(x))j=k});np.members.splice(j<0?np.members.length:j+1,0,m)}
  S.pending=false;
  if(JSON.stringify(np.members)===before&&!msg){render();return}
  savePlan(np);
  if(msg)toast(msg);else if(famChanged)toast(`${m.name} → ${hh?np.households.find(h=>h.id===hh).name:'por su cuenta'}${isKid(m)?' (niño)':''}`);
}
function moveFamily(id,t){
  const np=clone(plan());const i=np.households.findIndex(h=>h.id===id);if(i<0){render();return}
  const [h]=np.households.splice(i,1);let j=np.households.findIndex(x=>x.id===t.id);if(t.after)j++;np.households.splice(j,0,h);
  S.pending=false;savePlan(np);
}
function nudgeFamily(id,dir){
  const np=clone(plan());const i=np.households.findIndex(h=>h.id===id);const j=i+dir;if(i<0||j<0||j>=np.households.length)return;
  [np.households[i],np.households[j]]=[np.households[j],np.households[i]];savePlan(np);
  setTimeout(()=>document.querySelector(`[data-hgrip="${id}"]`)?.focus(),30);
}

/* ---------- Hojas ---------- */
/* Las hojas entran en el historial: «atrás» cierra la hoja en vez de salir del grupo. También se cierran arrastrando hacia abajo. */
function sheet(html,onMount,focus=true,tall=false){
  const r=document.getElementById('sheetRoot');
  r.innerHTML=`<div class="scrim" id="scrim"><div class="sheet${tall?' tall':''}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  if(!(history.state&&history.state.sheet))try{history.pushState({...(history.state||{}),sheet:1},'')}catch(x){}
  swipeClose(r.querySelector('.sheet'));
  document.getElementById('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
  document.addEventListener('keydown',escClose);onMount&&onMount(r.querySelector('.sheet'));
  if(focus)setTimeout(()=>r.querySelector('input')?.focus(),60);
}
function escClose(e){if(e.key==='Escape')closeSheet()}
function closeSheet(fromPop){const hk=S.onSheetClose;S.onSheetClose=null;if(hk)try{hk()}catch(x){}if(S.accUnsub){S.accUnsub();S.accUnsub=null}if(S.logUnsub){S.logUnsub();S.logUnsub=null}const r=document.getElementById('sheetRoot');const had=!!r.innerHTML;r.innerHTML='';document.removeEventListener('keydown',escClose);
  if(had&&fromPop!==true&&history.state&&history.state.sheet){S.skipPop=(S.skipPop||0)+1;try{history.back()}catch(x){}}}
function swipeClose(sh){
  if(!sh)return;let y0=null,dy=0,on=false,t0=0,lastY=0,lastT=0,vel=0;
  const scrim=sh.parentElement;const skip=t=>t.closest('input,select,textarea,.rcal,.modes,.cols,.pchips');
  /* La animación de entrada solo una vez: si se reactivara al soltar, la hoja «saltaría» arriba antes de bajar. */
  sh.addEventListener('animationend',()=>sh.classList.add('shown'),{once:true});setTimeout(()=>sh.classList.add('shown'),400);
  const setDim=f=>{scrim.style.backgroundColor=`rgba(10,14,12,${(.45*f).toFixed(3)})`};
  sh.addEventListener('touchstart',e=>{if(e.touches.length!==1||skip(e.target)){y0=null;return}y0=lastY=e.touches[0].clientY;t0=lastT=performance.now();dy=0;vel=0;on=sh.scrollTop<=0;sh.classList.remove('snap');scrim.classList.remove('fading')},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;const y=e.touches[0].clientY,t=performance.now();dy=y-y0;
    if(!on){if(sh.scrollTop<=0&&dy>0){on=true;y0=y;dy=0}else return}
    if(t>lastT)vel=(y-lastY)/(t-lastT);lastY=y;lastT=t;
    if(dy<=0){sh.style.transform='';setDim(1);return}e.preventDefault();sh.classList.add('shown','dragging');
    sh.style.transform=`translate3d(0,${dy}px,0)`;setDim(Math.max(0,1-dy/(sh.offsetHeight||600)))},{passive:false});
  sh.addEventListener('touchend',()=>{if(y0==null)return;y0=null;sh.classList.remove('dragging');
    const close=on&&(dy>Math.min(140,(sh.offsetHeight||600)*.3)||(dy>40&&vel>0.6));
    if(dy>0){sh.classList.add('snap');scrim.classList.add('fading');
      if(close){sh.style.transform='translate3d(0,100%,0)';setDim(0);let gone=false;const fin=()=>{if(gone)return;gone=true;closeSheet()};sh.addEventListener('transitionend',fin,{once:true});setTimeout(fin,300)}
      else{sh.style.transform='';setDim(1);setTimeout(()=>{sh.classList.remove('snap');scrim.classList.remove('fading')},260)}}
    on=false;dy=0});
}

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2600)}

/* Ficha de familia: cuentas por miembro y ajustes internos. El primer adulto lleva la cuenta de la familia. */
function famAccounts(p,hid){
  const ms=p.members.filter(m=>m.hh===hid);const ord=[...ms.filter(m=>!isKid(m)),...ms.filter(isKid)];
  const cf=compute(p),ci=compute(p,true,false);const F=cf.net['h:'+hid]||0;const head=famHead(p,hid);
  const own=id=>ci.net['m:'+id]||0;
  const kidPaid=id=>p.expenses.reduce((a,e)=>a+(kindOf(e)==='gasto'&&e.payer==='m:'+id?e.amount:0),0);
  const rows=ord.map(m=>{const o=own(m.id),c=ci.chg[m.id]||0;return {m,aport:isKid(m)?kidPaid(m.id):(Math.round((ci.exact['m:'+m.id]||0)+c)||0),cons:isKid(m)?(ci.cons[m.id]||0):c,out:m===head?(-F||0):0,net:null,own:o}});
  const kidsOwn=rows.filter(r=>isKid(r.m)&&r.m!==head).reduce((a,r)=>a+r.own,0);
  rows.forEach(r=>{if(isKid(r.m)&&r.m!==head)return;r.net=r.own+(r.m===head?kidsOwn-F:0)});
  /* Invitados: quien lleva la cuenta cubre lo que tienen a su cargo; solo se les devuelve lo que hayan aportado. */
  const h=p.households.find(x=>x.id===hid);const inv=new Set((h&&h.invited||[]).filter(id=>head&&id!==head.id&&ms.some(m=>m.id===id&&!isKid(m))));

function shareBasis(p,e,m){
  const M=Object.fromEntries(p.members.map(x=>[x.id,x]));const parts=(e.parts||[]).filter(id=>M[id]);const n=parts.length;const v=(e.vals||{})[m.id];
  switch(e.mode){
    case 'iguales':return `1 de ${n} a partes iguales`;
    case 'familias':{const u=new Set(parts.map(id=>unitOf(p,'m:'+id))).size;return `por familias (${u} unidades), peso ×${numToInput(wOf(m))}`}
    case 'porcentaje':return `${numToInput(+v||0)} %`;
    case 'acciones':{const t=parts.reduce((a,id)=>a+(+(e.vals||{})[id]||0),0);return `${numToInput(+v||0)} de ${numToInput(t)} acciones`}
    case 'importe':return 'importe fijo';
    case 'ajuste':return v?`igual ${v>0?'+':'−'} ${money(Math.abs(v))} de ajuste`:'a partes iguales, sin ajuste';
    default:{const W=parts.reduce((a,id)=>a+wOf(M[id]),0);return `peso ×${numToInput(wOf(m))} de ${numToInput(W)}`}
  }
}
function personOps(p,m){
  const me='m:'+m.id,myU=unitOf(p,me),fam=myU.startsWith('h:')?myU:null;const out=[];
  [...p.expenses].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0)).forEach(e=>{
    const k=kindOf(e);const who=x=>x===me?'Tú':esc(unitName(p,x));
    if(k==='transfer'){
      const mine=[e.payer,e.to].some(x=>x===me||(fam&&x===fam));if(!mine)return;
      const out_=e.payer===me||(fam&&e.payer===fam);
      out.push({e,ico:'⇄',bg:'var(--sunk)',t:e.desc||'Transferencia',d:`${esc(unitName(p,e.payer))} → ${esc(unitName(p,e.to))}${fam&&(e.payer===fam||e.to===fam)?' (su familia)':''}`,a:`${out_?'Envió':'Recibió'} ${money(e.amount)}`,cls:'muted'});return}
    const inP=(e.parts||[]).includes(m.id);const jt=jointOf(p,e.payer);const paidJ=jt&&jt.ids.includes(m.id);const paidMe=e.payer===me,paidFam=fam&&e.payer===fam;
    if(!inP&&!paidMe&&!paidFam&&!paidJ)return;
    const sh=inP?(sharesOf(p,e)[m.id]||0):0;const cat=k==='ingreso'?{l:'+',c:'#1D7A4C'}:catOf(e.cat);
    const bits=[];bits.push(`Total ${money(e.amount)}`);
    if(paidMe)bits.push(k==='ingreso'?'lo recibió él/ella':'lo pagó él/ella');else if(paidJ)bits.push(`${k==='ingreso'?'lo recibió':'lo pagó'} la cuenta conjunta ${esc(jointName(p,jt))}`);else if(paidFam)bits.push(k==='ingreso'?'lo recibió su familia':'lo pagó su familia');else bits.push(`${k==='ingreso'?'recibió':'pagó'} ${esc(unitName(p,e.payer))}`);
    if(inP)bits.push(shareBasis(p,e,m));else bits.push('no participa en el reparto');
    const rg=fmtRange(e);if(rg)bits.push(esc(rg));
    out.push({e,ico:cat.l,bg:cat.c+'22',t:e.desc,d:bits.join(' · '),a:inP?(k==='ingreso'?'+':'')+money(sh):'—',cls:k==='ingreso'?'v pos':'',sub:inP?'su parte':''});
  });
  return out;
}

      ['super','s[uú]per|mercadona|carrefour|lidl|alcampo|eroski|compra|fruter|panader'],['excursion','excursi|ruta|kayak|barco|gu[ií]a|tour'],['cafe','caf[eé]|desayuno|churros|cafeter'],['bebida','cerveza|ca[ñn]as|copas|vino|bar|bebida|sidra|vermut'],
      ['comida','cena|comida|restaurante|men[uú]|pizza|tapas|sidrer|asador|marisquer|burger|kebab|empanada|helado'],['ocio','entradas|cine|museo|concierto|parque|teatro|bolera'],
      ['regalo','regalo|cumple'],['salud','farmacia|m[eé]dico|tiritas'],['ninos','pañales|juguete|colegio|guarder'],
      ['mascota','perro|gato|veterin|pienso'],['casa','limpieza|lavander|detergente'],['compras','ropa|tienda|souvenir']];
    $('#edesc').addEventListener('input',ev=>{if(st.catManual||st.kind!=='gasto')return;const t=ev.target.value.toLowerCase();
      const hit=KW.find(([k,re])=>new RegExp('(^|\\b)('+re+')').test(t));if(hit&&hit[0]!==st.cat){st.cat=hit[0];s.querySelectorAll('#ecats button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.k===st.cat));showCat()}});
    $('#eopen').onclick=()=>{st.open=!st.open;draw()};
    $('#emore').onclick=()=>{st.more=!st.more;draw()};
    s.querySelectorAll('#emodes button[data-m]').forEach(b=>b.onclick=()=>{const was=st.mode;st.mode=b.dataset.m;if(was!==st.mode){st.touched=false;refill()}draw()});
    amt.oninput=()=>{calcHint();if(st.mode==='importe'&&!st.touched)refill();updateVals()};
    const pl=$('#eplus');pl.onpointerdown=ev=>ev.preventDefault();pl.onclick=()=>{if(amt.value.trim()&&!/[+\-*\/]$/.test(amt.value.trim()))amt.value=amt.value.trim()+'+';amt.focus();calcHint()};
    amt.onblur=()=>{const v=calcEur(amt.value);if(/[+*×x\/]|\d\s*-/.test(amt.value)&&!isNaN(v)&&v>0){amt.value=centsToInput(v);calcHint()}};
    const sel=()=>[...st.parts].filter(id=>M[id]);
    function refill(){
      const ids=sel();
      if(st.mode==='porcentaje'){st.vals={};const sh=splitWeighted(10000,ids,()=>1);ids.forEach(id=>st.vals[id]=sh[id]/100)}
      else if(st.mode==='acciones'){const nv={};ids.forEach(id=>nv[id]=st.vals[id]>0&&Number.isFinite(+st.vals[id])?+st.vals[id]:1);st.vals=nv}
      else if(st.mode==='importe'){st.custom=splitWeighted(total(),ids,()=>1)}
      else if(st.mode==='ajuste'){const nv={};ids.forEach(id=>{if(st.vals[id])nv[id]=st.vals[id]});st.vals=nv}
    }
    function onSelChange(){if(INPUT_MODES[st.mode]&&(!st.touched||st.mode==='acciones'||st.mode==='ajuste'))refill();else if(INPUT_MODES[st.mode]){const ids=new Set(sel());for(const k in st.vals)if(!ids.has(k))delete st.vals[k];for(const k in st.custom)if(!ids.has(k))delete st.custom[k]}draw()}
    function draw(){
      if(st.kind==='transfer')return;
      $('#edetail').hidden=!st.open;$('#eopen').textContent=st.open?'Listo':'Cambiar';
      s.querySelectorAll('#emodes button[data-m]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.m===st.mode);if(b.hasAttribute('data-more'))b.hidden=!st.more&&b.dataset.m!==st.mode});
      $('#emore').textContent=st.more?'Menos ▴':'Más formas ▾';
      $('#emhint').textContent=MODES.find(m=>m.k===st.mode).h;
      const anyKidIn=p.members.some(m=>isKid(m)&&st.parts.has(m.id));const hasKids=p.members.some(m=>isKid(m)&&isOn(m));
      $('#equick').innerHTML=`<button class="ghost" data-q="all">Todos</button><button class="ghost" data-q="none">Nadie</button>${hasKids?`<button class="ghost" data-q="kids">${anyKidIn?'Quitar niños':'Poner niños'}</button><button class="ghost" data-q="adults">Solo adultos</button>`:''}${st.mode==='porcentaje'||st.mode==='importe'?'<button class="ghost" data-q="eq">Igualar</button>':''}`;
      s.querySelectorAll('#equick button').forEach(b=>b.onclick=()=>{const q=b.dataset.q;
        if(q==='all')p.members.filter(isOn).forEach(m=>st.parts.add(m.id));else if(q==='none')st.parts.clear();
        else if(q==='kids'){p.members.filter(m=>isKid(m)&&(anyKidIn||isOn(m))).forEach(m=>anyKidIn?st.parts.delete(m.id):st.parts.add(m.id))}
        else if(q==='adults'){st.parts.clear();p.members.filter(m=>!isKid(m)&&isOn(m)).forEach(m=>st.parts.add(m.id))}
        else if(q==='eq'){st.touched=false;refill();draw();return}
        onSelChange()});
      const inp=INPUT_MODES[st.mode];
      const unit={porcentaje:'%',acciones:'partes',importe:'€',ajuste:'± €'}[st.mode];
      $('#eparts').innerHTML=groups.map((g,gi)=>{const allIn=g.ms.every(m=>st.parts.has(m.id));
        return `<div class="sgroup" style="--hc:${g.h?g.h.color:'var(--line)'}"><div class="gh">${g.h?esc(g.h.name):g.flat?'Todos':'Por su cuenta'}<button class="ghost" data-g="${gi}">${allIn?'Quitar':'Todos'}</button></div>
        ${g.ms.map(m=>{const on=st.parts.has(m.id);let v='';
          if(inp&&on){const raw=st.mode==='importe'?st.custom[m.id]:st.vals[m.id];v=raw==null||raw===''?'':(st.mode==='importe'||st.mode==='ajuste')?centsToInput(raw):numToInput(raw)}
          return `<div class="srow"><button class="stog" data-m="${m.id}" aria-pressed="${on}"><span class="box"></span><span class="nm">${esc(m.name)}</span>${mTags(m)}</button>
          ${inp&&on?`<input class="num" inputmode="decimal" data-v="${m.id}" value="${v}" aria-label="${unit} de ${esc(m.name)}" placeholder="${st.mode==='ajuste'?'0':''}">`:''}<span class="sv" data-sv="${m.id}"></span></div>`}).join('')}</div>`}).join('');
      s.querySelectorAll('.stog').forEach(b=>b.onclick=()=>{const id=b.dataset.m;st.parts.has(id)?st.parts.delete(id):st.parts.add(id);onSelChange()});
      s.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=groups[+b.dataset.g];const all=g.ms.every(m=>st.parts.has(m.id));g.ms.forEach(m=>all?st.parts.delete(m.id):st.parts.add(m.id));onSelChange()});
      s.querySelectorAll('#eparts input').forEach(i=>i.oninput=()=>{st.touched=true;const id=i.dataset.v;
        if(st.mode==='importe'){const v=parseEur(i.value);if(isNaN(v))delete st.custom[id];else st.custom[id]=v}
        else if(st.mode==='ajuste'){const v=parseEur(i.value);if(isNaN(v))delete st.vals[id];else st.vals[id]=v}
        else{const v=parseNum(i.value);if(isNaN(v))delete st.vals[id];else st.vals[id]=v}
        updateVals()});
      updateVals();
    }
    function draft(){const ids=sel();const vals={},custom={};
      if(st.mode==='importe')ids.forEach(id=>custom[id]=st.custom[id]||0);
      else if(INPUT_MODES[st.mode])ids.forEach(id=>{if(st.vals[id]!=null)vals[id]=st.vals[id]});
      return {amount:total(),mode:st.mode,parts:ids,vals,custom}}
    function check(d){
      const n=d.parts.length;if(!n)return {bad:'Marca al menos a una persona.'};
      if(st.mode==='peso'&&!d.parts.reduce((a,id)=>a+wOf(M[id]),0))return {bad:'Todos los marcados tienen peso ×0.'};
      if(st.mode==='porcentaje'){const sum=Math.round(d.parts.reduce((a,id)=>a+(+d.vals[id]||0),0)*100)/100;if(Math.abs(sum-100)>0.001)return {bad:`Suma ${numToInput(sum)} %. ${sum<100?'Faltan':'Sobran'} ${numToInput(Math.abs(100-sum))} %.`};return {ok:'Suma 100 %. Perfecto.'}}
      if(st.mode==='acciones'){const sum=d.parts.reduce((a,id)=>a+Math.max(0,+d.vals[id]||0),0);if(!sum)return {bad:'Pon al menos una parte a alguien.'};return {ok:`${numToInput(sum)} partes en total · ${d.amount?money(Math.round(d.amount/sum)):'—'} por parte.`}}
      if(st.mode==='importe'){const sum=d.parts.reduce((a,id)=>a+(d.custom[id]||0),0);const diff=d.amount-sum;if(diff)return {bad:`${diff>0?'Faltan':'Sobran'} ${money(Math.abs(diff))} por asignar.`};return {ok:'Cuadra con el total.'}}
      if(st.mode==='ajuste'){const adj=d.parts.reduce((a,id)=>a+Math.round(+d.vals[id]||0),0);const base=d.amount-adj;if(base<0)return {bad:'Los ajustes superan el total.'};
        const sh=sharesOf(p,d);if(Object.values(sh).some(v=>v<0))return {bad:'Algún ajuste deja a alguien en negativo.'};return {ok:`Base a partes iguales: ${money(Math.round(base/n))} por persona.`}}
      if(st.mode==='familias'){const u=new Set(d.parts.map(id=>unitOf(p,'m:'+id))).size;return {ok:`${u} ${u===1?'unidad':'unidades'} · ${d.amount?money(Math.round(d.amount/u)):'—'} cada una.`}}
      if(st.mode==='peso'&&d.parts.every(id=>wOf(M[id])===1))return {ok:`${n} ${n===1?'persona':'personas'} · ${d.amount?money(Math.round(d.amount/n)):'—'} cada una.`,short:d.amount?`${money(Math.round(d.amount/n))} cada uno`:`${n} ${n===1?'persona':'personas'}`};
      if(st.mode==='peso'){const W=d.parts.reduce((a,id)=>a+wOf(M[id]),0);return {ok:`${n} personas · ${numToInput(W)} adultos equivalentes · ${d.amount?money(Math.round(d.amount/W)):'—'} por adulto.`,short:d.amount?`${money(Math.round(d.amount/W))} por adulto · ${numToInput(W)} adultos eq.`:`${numToInput(W)} adultos equivalentes`}}
      return {ok:`${n} personas · ${d.amount?money(Math.round(d.amount/n)):'—'} cada una.`};
    }
    function updateVals(){
      if(st.kind==='transfer')return;const d=draft();const sh=d.amount?sharesOf(p,d):{};
      s.querySelectorAll('[data-sv]').forEach(x=>{const id=x.dataset.sv;x.textContent=st.parts.has(id)&&d.amount?money(sh[id]||0):''});
      const r=check(d);const el=$('#estatus');el.textContent=r.bad||r.ok;el.className='status '+(r.bad?'bad':'good');
      const n=d.parts.length,all=n===actIds.length&&d.parts.every(id=>actIds.includes(id));
      $('#esumt').textContent=(n?(all?`Entre todos (${n})`:`Entre ${n} ${n===1?'persona':'personas'}`):'Sin nadie marcado')+' · '+modeLabel(p,st.mode,d.parts);
      const ss=$('#esums');ss.textContent=r.bad||r.short||r.ok;ss.className=r.bad?'bad':'';
    }
    setKind();draw();
    {const si=$('#estart'),ei=$('#eend');const txt=()=>{const a=si.value,b=ei.value;$('#rclr').hidden=!a;
        $('#rtxt').innerHTML=!a?'Toca el primer y el último día.':!b?`Desde el <b>${esc(fmtShort(a))}</b> · toca el último día`:`<b>${esc(fmtShort(a))} – ${esc(fmtShort(b))}</b> · ${dayList(a,b).length} días`};
      const cal=rangeCal($('#rcal'),{start:si.value,end:ei.value,onChange:(a,b)=>{si.value=a;ei.value=b;txt()}});
      $('#rclr').onclick=()=>{si.value='';ei.value='';cal.set('','');txt()};txt()}
    let again=false;const ag=$('#eagain');if(ag)ag.onclick=()=>{again=true;$('#esave').click();again=false};
    $('#esave').onclick=()=>{
      const fail=failer(s);const amount=total();
      if(!(amount>0))return fail('Escribe un importe mayor que cero, por ejemplo 42,50.');
      const date=$('#edate').value||today();const np=clone(p);let ne;
      const dStart=$('#estart').value,dEnd=$('#eend').value;const ps=dStart||date;
      if(dEnd&&dEnd<ps)return fail(dStart?'«Hasta» es anterior a «Desde».':'«Hasta» es anterior a la fecha de la operación. Pon también «Desde».');
      if(st.kind==='transfer'){
        if(pay.value===to.value)return fail('Quien paga y quien recibe son la misma persona.');
        ne={id:e?.id||uid(),kind:'transfer',desc:$('#edesc').value.trim()||'Transferencia',amount,payer:pay.value,to:to.value,date,parts:[],created:e?.created||Date.now()};
        if(e?.settle||pre?.settle)ne.settle=true;
      }else{
        const d=draft();const r=check(d);if(r.bad){st.open=true;draw();return fail(r.bad)}
        ne={id:e?.id||uid(),kind:st.kind==='ingreso'?'ingreso':undefined,desc:$('#edesc').value.trim()||(st.kind==='ingreso'?'Ingreso':(st.cat!=='otros'&&CATS.find(c=>c.k===st.cat)?.n||'Gasto')),
          amount,cat:st.kind==='gasto'?st.cat:'otros',payer:pay.value,date,mode:st.mode,parts:d.parts,custom:st.mode==='importe'?d.custom:{},vals:st.mode!=='importe'&&INPUT_MODES[st.mode]?d.vals:{},created:e?.created||Date.now()};
        if(!ne.kind)delete ne.kind;if(dStart&&dStart!==date)ne.dateStart=dStart;if(dEnd&&dEnd!==ps)ne.dateEnd=dEnd;
      }
      done=true;if(!e)S.entryDraft=null;
      if(e)np.expenses[np.expenses.findIndex(x=>x.id===e.id)]=ne;else np.expenses.push(ne);
      if(!e&&st.kind!=='transfer'){try{localStorage.setItem('cf_pay_'+p.id,pay.value)}catch(x){}}
      const inner=st.kind==='transfer'&&FEAT.families&&unitOf(p,pay.value)===unitOf(p,to.value)&&unitOf(p,pay.value).startsWith('h:');
      savePlan(np);closeSheet();toast(e?'Movimiento actualizado':inner?'Apuntada. Solo cambia las cuentas dentro de la familia.':pre?.settle&&st.kind==='transfer'?`${payLabel(np,pay.value)} pagó ${money(amount)}`:st.kind==='transfer'?'Transferencia apuntada':st.kind==='ingreso'?'Ingreso apuntado':'Gasto apuntado');
      if(again){const k=st.kind,d=date;setTimeout(()=>openEntry(null,{kind:k,date:d}),80)}
    };
    const dl=$('#edel');if(dl)dl.firstElementChild.onclick=()=>askDel(dl,'Se borrará este movimiento.',()=>{const np=clone(plan());np.expenses=np.expenses.filter(x=>x.id!==e.id);savePlan(np);closeSheet();toast('Movimiento borrado')});
  },!id&&!pre?.settle,true);
}
/* Calendario para elegir inicio y fin en la misma vista (como en los buscadores de vuelos). */
function rangeCal(box,{start,end,onChange}){
  let a=start||'',b=end||'';let view=(a||today()).slice(0,7);const pad=n=>String(n).padStart(2,'0');
  const draw=()=>{const [y,m]=view.split('-').map(Number);const first=new Date(Date.UTC(y,m-1,1));const off=(first.getUTCDay()+6)%7;const days=new Date(Date.UTC(y,m,0)).getUTCDate();
    const tit=first.toLocaleDateString('es-ES',{month:'long',year:'numeric',timeZone:'UTC'});const t=today();
    let cells='';for(let i=0;i<off;i++)cells+='<span></span>';
    for(let d=1;d<=days;d++){const k=`${y}-${pad(m)}-${pad(d)}`;const cl=[k===a?'s':'',k===(b||a)&&a?'e':'',a&&b&&k>a&&k<b?'in':'',k===t?'td':''].filter(Boolean).join(' ');cells+=`<button type="button" data-d="${k}" class="${cl}">${d}</button>`}
    box.innerHTML=`<div class="rh"><button type="button" data-n="-1" aria-label="Mes anterior">‹</button><span>${tit.charAt(0).toUpperCase()+tit.slice(1)}</span><button type="button" data-n="1" aria-label="Mes siguiente">›</button></div>
      <div class="rg">${['L','M','X','J','V','S','D'].map(x=>`<small>${x}</small>`).join('')}${cells}</div>`;
    box.querySelectorAll('[data-n]').forEach(x=>x.onclick=()=>{let [yy,mm]=view.split('-').map(Number);mm+=+x.dataset.n;if(mm<1){mm=12;yy--}if(mm>12){mm=1;yy++}view=`${yy}-${pad(mm)}`;draw()});
    box.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{const k=x.dataset.d;if(!a||b||k<a){a=k;b=''}else if(k===a){b=''}else b=k;draw();onChange(a,b)})};
  draw();return {set:(x,y)=>{a=x||'';b=y||'';if(a)view=a.slice(0,7);draw()}};
}

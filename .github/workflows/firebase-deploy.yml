# Cada push a main publica la app en Firebase Hosting (pachote-78042.web.app).
# Los datos viven en el Firebase de Listopic: sus reglas se despliegan desde el repo de Listopic.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (JSON de la cuenta de servicio) en Settings → Secrets → Actions.
name: Desplegar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Si cambia algún saldo o falla el recorrido básico, no se publica.
  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Instalar
        working-directory: tests
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Ejecutar pruebas
        working-directory: tests
        run: node run.mjs

  hosting:
    name: App (Hosting)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pachote-78042
          channelId: live
          # firebase-tools 15.3x comprueba la API con serviceusage.services.get, permiso que la
          # cuenta de servicio no tiene (403). Con la 13 desplegaba bien; se puede volver a «latest»
          # si se le da el rol «Consumidor de Service Usage» en el proyecto pachote-78042.
          firebaseToolsVersion: '13'

